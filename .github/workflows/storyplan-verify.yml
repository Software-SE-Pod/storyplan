# Checks a pull request against the pre-PR it implements. Deterministic: no model involved.
# The PR links its story with "Closes #<n>"; the pre-PR is the story's sub-issue labelled `pre-pr`.
# CI reads the plan embedded in that issue and runs `storyplan verify` against the PR's diff.
name: storyplan-verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the pre-PR for this PR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          story=$(printf '%s' "${PR_BODY}" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|implements?) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "${story}" ]; then
            echo "No story linked (use 'Closes #<story>'); nothing to verify."
            exit 0
          fi
          pre=$(gh api "repos/${REPO}/issues/${story}/sub_issues" --jq '[.[] | select(any(.labels[]; .name == "pre-pr"))][0].number // empty' 2>/dev/null || true)
          if [ -z "${pre}" ]; then
            pre=$(gh issue list -R "${REPO}" --label pre-pr --state all --search "\"[pre-PR] STORY-${story}:\" in:title" --json number --jq '.[0].number // empty')
          fi
          if [ -z "${pre}" ]; then
            echo "::warning::Story #${story} has no StoryPlan pre-PR; label it 'storyplan' to create one."
            exit 0
          fi
          gh issue view "${pre}" -R "${REPO}" --json body --jq .body > "${RUNNER_TEMP}/pre-pr.md"
          echo "issue=${pre}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6.0.0
        if: steps.plan.outputs.issue != ''
        with:
          dotnet-version: "10.0.x"

      - name: Verify PR against the plan
        if: steps.plan.outputs.issue != ''
        env:
          BASE_REF: ${{ github.base_ref }}
          PRE_PR: ${{ steps.plan.outputs.issue }}
        run: |
          set -euo pipefail
          # Build StoryPlan from the base branch, so a PR can't change the checker that judges it.
          git worktree add --quiet "${RUNNER_TEMP}/base" "origin/${BASE_REF}"
          dotnet publish "${RUNNER_TEMP}/base/src/StoryPlan.Mcp/StoryPlan.Mcp.fsproj" -c Release -o "${RUNNER_TEMP}/storyplan" --nologo -v q
          set +e
          "${RUNNER_TEMP}/storyplan/storyplan" verify "${RUNNER_TEMP}/pre-pr.md" "origin/${BASE_REF}" HEAD \
            --root "${GITHUB_WORKSPACE}" | tee "${RUNNER_TEMP}/verify.txt"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### StoryPlan verify (pre-PR #${PRE_PR})"
            echo '```'
            cat "${RUNNER_TEMP}/verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"
